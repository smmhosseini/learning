<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لیست کارها</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>لیست کارهای من</h1>

      <div class="input-area">
        <input
          type="text"
          id="taskInput"
          placeholder="یک کار جدید بنویس..."
        />
        <button id="addBtn">افزودن</button>
      </div>

      <ul id="taskList"></ul>

      <p id="emptyMsg">هنوز کاری اضافه نکردی 🌱</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
